<li class="resource-card">
  <h2 class="resource-title">{{ resource?.title }}</h2>
  <p>{{ resource?.description }}</p>

  <a class="resource-link-container" href="{{ resource?.url }}" target="_blank">
    <div class="resource-link">
      {{ getFormattedUrl(resource?.url) }}
    </div>
    <span class="resource-arrow"
      ><img
        class="arrow-icon"
        src="./arrow-right.svg"
        alt="arrow pointing right"
    /></span>
  </a>
  @if(isAdmin){
  <a routerLink="{{ '/resource/edit/' + resource?._id }}">edit</a>
  }
</li>

@if(showModal){
<app-card-modal (closeModal)="closeModal()" [resource]="resource" />
}
